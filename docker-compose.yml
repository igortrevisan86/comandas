version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: comandas_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-comandas_db}
      POSTGRES_USER: ${POSTGRES_USER:-comandas_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-SenhaSeguraComandas2026!}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - internal_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-comandas_admin} -d ${POSTGRES_DB:-comandas_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    # Porta 5432 propositalmente NÃO publicada para a rede externa por segurança

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: comandas_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-comandas_admin}:${POSTGRES_PASSWORD:-SenhaSeguraComandas2026!}@db:5432/${POSTGRES_DB:-comandas_db}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal_net
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8000/api/health\")'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: comandas_frontend
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - internal_net

networks:
  internal_net:
    driver: bridge

volumes:
  pgdata:
    driver: local
